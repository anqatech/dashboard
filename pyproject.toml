[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-dashboard"
version = "0.1.0"
description = "Python-first stock market dashboard with a Dash frontend."
requires-python = ">=3.12"
dependencies = [
  "dash>=4,<5",
  "dash-ag-grid>=35,<36",
  "pandas>=2.2,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.9,<4",
  "lxml>=5.3,<6",
  "pyarrow>=16,<20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dash_app = ["assets/*", "pages/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
